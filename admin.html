<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Dokan Admin</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-5">
 <form onsubmit="login(event)" class="bg-white w-full max-w-sm p-7 rounded-3xl shadow-xl">
  <h1 class="text-2xl font-bold">Device Dokan Admin</h1>
  <p class="text-gray-500 mt-1 mb-6">Product Management</p>
  <input id="user" class="w-full border rounded-xl p-3 mb-3" placeholder="Username" required>
  <input id="pass" type="password" class="w-full border rounded-xl p-3 mb-4" placeholder="Password" required>
  <button class="w-full bg-orange-500 text-white p-3 rounded-xl font-semibold">Login</button>
  <p id="err" class="text-red-500 text-sm mt-3"></p>
 </form>
</div>
<div id="app" class="hidden max-w-6xl mx-auto p-5">
 <div class="flex justify-between items-center mb-6">
  <div><h1 class="text-3xl font-bold">Admin Panel</h1><p class="text-gray-500">Product Management</p></div>
  <div class="flex gap-2"><a href="index.html" target="_blank" class="border px-4 py-2 rounded-xl bg-white">Website</a><button onclick="logout()" class="bg-gray-900 text-white px-4 py-2 rounded-xl">Logout</button></div>
 </div>
 <div class="grid lg:grid-cols-3 gap-6">
  <form id="productForm" onsubmit="saveProduct(event)" class="bg-white p-6 rounded-3xl shadow lg:col-span-1">
   <h2 id="formTitle" class="text-xl font-bold mb-4">Add Product</h2>
   <input type="hidden" id="id">
   <label class="text-sm">Product Name</label><input id="name" required class="w-full border rounded-xl p-3 mb-3">
   <label class="text-sm">Price</label><input id="price" type="number" required class="w-full border rounded-xl p-3 mb-3">
   <label class="text-sm">Storage</label><input id="storage" placeholder="256GB" class="w-full border rounded-xl p-3 mb-3">
   <label class="text-sm">RAM</label><input id="ram" placeholder="12GB" class="w-full border rounded-xl p-3 mb-3">
   <label class="text-sm">Color</label><input id="color" class="w-full border rounded-xl p-3 mb-3">
   <label class="text-sm">Description</label><textarea id="description" class="w-full border rounded-xl p-3 mb-3"></textarea>
   <label class="flex items-center gap-2 mb-3"><input id="stock" type="checkbox" checked> In Stock</label>
   <label class="text-sm">Product Image</label><input id="imageFile" type="file" accept="image/*" class="w-full mb-4">
   <div class="flex gap-2"><button class="flex-1 bg-orange-500 text-white p-3 rounded-xl font-semibold">Save Product</button><button type="button" onclick="resetForm()" class="px-4 border rounded-xl">Clear</button></div>
  </form>
  <div class="bg-white p-6 rounded-3xl shadow lg:col-span-2">
   <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Products</h2><span id="count" class="text-gray-500"></span></div>
   <div id="list" class="space-y-3"></div>
  </div>
 </div>
 <div class="mt-6 bg-yellow-50 border border-yellow-200 rounded-2xl p-4 text-sm text-yellow-800">
  এই version-এ product data এই browser-এর localStorage-এ রাখা হচ্ছে। ফলে এটি demo/initial version। সব device থেকে একই product দেখতে হলে Firebase/Supabase backend যুক্ত করতে হবে।
 </div>
</div>
<script>
const USER="admin", PASS="DeviceDokan@2026";
let products=load();
function load(){try{return JSON.parse(localStorage.getItem("deviceDokanProducts"))||[]}catch(e){return[]}}
function persist(){localStorage.setItem("deviceDokanProducts",JSON.stringify(products));render();}
function login(e){e.preventDefault();if(user.value===USER&&pass.value===PASS){sessionStorage.setItem("ddAdmin","1");showApp()}else err.textContent="Username অথবা password ভুল।"}
function showApp(){loginEl.classList.add("hidden");app.classList.remove("hidden");render()}
function logout(){sessionStorage.removeItem("ddAdmin");location.reload()}
const loginEl=document.getElementById("login");
if(sessionStorage.getItem("ddAdmin")==="1")showApp();
async function saveProduct(e){
 e.preventDefault();
 let image=document.getElementById("imageFile").files[0];
 let data={id:document.getElementById("id").value||Date.now().toString(),name:name.value,price:price.value,storage:storage.value,ram:ram.value,color:color.value,description:description.value,stock:stock.checked,image:""};
 const old=products.find(p=>p.id===data.id); if(old)data.image=old.image||"";
 if(image)data.image=await toDataURL(image);
 const i=products.findIndex(p=>p.id===data.id); if(i>=0)products[i]=data;else products.unshift(data);
 persist();resetForm();
}
function toDataURL(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function edit(id){let p=products.find(x=>x.id===id);if(!p)return;["id","name","price","storage","ram","color","description"].forEach(k=>document.getElementById(k).value=p[k]||"");stock.checked=p.stock!==false;document.getElementById("formTitle").textContent="Edit Product";scrollTo({top:0,behavior:"smooth"})}
function del(id){if(confirm("এই product delete করবেন?")){products=products.filter(p=>p.id!==id);persist()}}
function resetForm(){productForm.reset();id.value="";stock.checked=true;formTitle.textContent="Add Product"}
function render(){count.textContent=products.length+" products";list.innerHTML=products.map(p=>`<div class="border rounded-2xl p-3 flex gap-3 items-center"><div class="w-16 h-16 rounded-xl bg-orange-50 overflow-hidden flex items-center justify-center">${p.image?`<img src="${p.image}" class="w-full h-full object-contain">`:"📱"}</div><div class="flex-1"><b>${esc(p.name)}</b><div class="text-orange-500">৳${Number(p.price||0).toLocaleString("en-IN")}</div><div class="text-xs text-gray-500">${p.stock===false?"Out of Stock":"In Stock"} • ${esc(p.storage||"")} ${esc(p.ram||"")}</div></div><button onclick="edit('${p.id}')" class="border px-3 py-2 rounded-xl">Edit</button><button onclick="del('${p.id}')" class="bg-red-500 text-white px-3 py-2 rounded-xl">Delete</button></div>`).join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
</script>
</body></html>
